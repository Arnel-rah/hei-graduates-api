openapi: 3.0.3

info:
  title: HEI Graduates API
  version: 1.0.0
  description: API for managing HEI Graduates

servers:
  - url: /

tags:
  - name: Auth
  - name: Promotions
  - name: Groups
  - name: Students
  - name: Teachers
  - name: Courses
  - name: CourseAssignments
  - name: Exams
  - name: Grades
  - name: Transcripts

security:
  - bearerAuth: []

paths:
  /login:
    post:
      tags: [ Auth ]
      operationId: login
      summary: Authenticates a user (student, teacher, or admin) and returns a JWT.
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Successful authentication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /promotions:
    get:
      tags: [ Promotions ]
      operationId: getPromotions
      summary: Lists all promotions.
      x-poja-roles: [ ADMIN, TEACHER, STUDENT ]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: List of promotions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Promotion"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /promotions/{promotionId}:
    parameters:
      - $ref: "#/components/parameters/PromotionId"
    get:
      tags: [Promotions]
      operationId: getPromotionById
      summary: Retrieves a promotion by id.
      x-poja-roles: [ADMIN, TEACHER, STUDENT]
      responses:
        "200":
          description: The promotion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Promotion"
        "404":
          $ref: "#/components/responses/NotFound"

  /promotions/{promotionId}/graduates:
    parameters:
      - $ref: "#/components/parameters/PromotionId"
    get:
      tags: [Promotions]
      operationId: getPromotionGraduates
      summary: |
        Lists the graduates of a promotion (students with an overall
        average >= 10 across all subjects), sorted by rank.
      description: Restricted to admin, who is the only one allowed to see results across the 3 years.
      x-poja-roles: [ADMIN]
      parameters:
        - name: track
          in: query
          description: Optional filter by track.
          schema:
            $ref: "#/components/schemas/Track"
      responses:
        "200":
          description: List of graduates, sorted by rank.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Graduate"
        "404":
          $ref: "#/components/responses/NotFound"

  /promotions/{promotionId}/graduates/export:
    parameters:
      - $ref: "#/components/parameters/PromotionId"
    get:
      tags: [Promotions]
      operationId: exportPromotionGraduates
      summary: |
        Generates (or regenerates) the Excel file of a promotion's graduate
        list, uploads it to S3, then redirects to a pre-signed S3 URL for
        direct download.
      x-poja-roles: [ADMIN]
      parameters:
        - name: track
          in: query
          schema:
            $ref: "#/components/schemas/Track"
      responses:
        "302":
          description: Redirect to the pre-signed S3 URL of the xlsx file.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "404":
          $ref: "#/components/responses/NotFound"

  /groups:
    get:
      tags: [Groups]
      operationId: getGroups
      summary: Lists groups.
      x-poja-roles: [ADMIN, TEACHER]
      parameters:
        - name: promotionId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: List of groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
    post:
      tags: [Groups]
      operationId: createGroup
      summary: Creates a new group.
      x-poja-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupSave"
      responses:
        "201":
          description: Group created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"

  /groups/{groupId}/students:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Groups]
      operationId: getGroupStudents
      summary: Lists the students currently in this group.
      x-poja-roles: [ADMIN, TEACHER]
      responses:
        "200":
          description: Students of the group.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"

  /students:
    get:
      tags: [Students]
      operationId: getStudents
      summary: Lists students.
      x-poja-roles: [ADMIN, TEACHER]
      parameters:
        - name: groupId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: List of students.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
    post:
      tags: [Students]
      operationId: createStudent
      summary: Creates a student.
      x-poja-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentSave"
      responses:
        "201":
          description: Student created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  /students/{studentId}:
    parameters:
      - $ref: "#/components/parameters/StudentId"
    get:
      tags: [Students]
      operationId: getStudentById
      summary: |
        Retrieves a student. A student can only view THEIR OWN record
        (checked on the service side from the token); admin and teachers
        can view any record.
      x-poja-roles: [ADMIN, TEACHER, STUDENT]
      responses:
        "200":
          description: The student.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Students]
      operationId: updateStudent
      summary: Updates a student.
      x-poja-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentSave"
      responses:
        "200":
          description: Student updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  /students/{studentId}/grades:
    parameters:
      - $ref: "#/components/parameters/StudentId"
    get:
      tags: [Students]
      operationId: getStudentGrades
      summary: |
        A student's grades. A student can only see THEIR OWN grades,
        a teacher sees grades for their own courses, admin sees everything.
      x-poja-roles: [ADMIN, TEACHER, STUDENT]
      parameters:
        - name: semesterId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Grades of the student.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Grade"
        "403":
          $ref: "#/components/responses/Forbidden"

  /students/{studentId}/transcript-emails:
    parameters:
      - $ref: "#/components/parameters/StudentId"
    post:
      tags: [Transcripts]
      operationId: sendStudentTranscriptByEmail
      summary: |
        Triggers the asynchronous generation of the student's PDF transcript,
        uploads it to S3, then sends an email with an S3
        download link to the student's address.
      x-poja-roles: [ADMIN, STUDENT]
      responses:
        "202":
          description: Request accepted, processing is asynchronous.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptEmailRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /teachers:
    get:
      tags: [Teachers]
      operationId: getTeachers
      summary: Lists teachers.
      x-poja-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: List of teachers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Teacher"
    post:
      tags: [Teachers]
      operationId: createTeacher
      summary: Creates a teacher.
      x-poja-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherSave"
      responses:
        "201":
          description: Teacher created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Teacher"

  /teachers/{teacherId}/course-assignments:
    parameters:
      - name: teacherId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Teachers]
      operationId: getTeacherCourseAssignments
      summary: Lists the courses assigned to a teacher, across all years.
      x-poja-roles: [ADMIN, TEACHER]
      parameters:
        - name: academicYear
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Assigned courses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseAssignment"

  /courses:
    get:
      tags: [Courses]
      operationId: getCourses
      summary: Lists courses.
      x-poja-roles: [ADMIN, TEACHER, STUDENT]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: List of courses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
    post:
      tags: [Courses]
      operationId: createCourse
      summary: Creates a course.
      x-poja-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseSave"
      responses:
        "201":
          description: Course created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

  /course-assignments:
    get:
      tags: [CourseAssignments]
      operationId: getCourseAssignments
      summary: Lists course/teacher/group assignments.
      x-poja-roles: [ADMIN, TEACHER]
      parameters:
        - name: academicYear
          in: query
          schema:
            type: integer
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: List of assignments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseAssignment"
    post:
      tags: [CourseAssignments]
      operationId: createCourseAssignment
      summary: |
        Assigns a course to a teacher for a given year, for one or more
        specific groups.
      x-poja-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseAssignmentSave"
      responses:
        "201":
          description: Assignment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseAssignment"

  /course-assignments/{courseAssignmentId}/exams:
    parameters:
      - name: courseAssignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Exams]
      operationId: getCourseAssignmentExams
      summary: Lists the exams of a course assignment.
      x-poja-roles: [ADMIN, TEACHER]
      responses:
        "200":
          description: List of exams.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exam"
    post:
      tags: [Exams]
      operationId: createExam
      summary: Creates an exam for this course assignment.
      x-poja-roles: [ADMIN, TEACHER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExamSave"
      responses:
        "201":
          description: Exam created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exam"

  /exams/{examId}/grades:
    parameters:
      - name: examId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Grades]
      operationId: getExamGrades
      summary: Lists the grades recorded for an exam.
      x-poja-roles: [ADMIN, TEACHER]
      responses:
        "200":
          description: Grades of the exam.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Grade"

  /exams/{examId}/grades/{studentId}:
    parameters:
      - name: examId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/StudentId"
    put:
      tags: [Grades]
      operationId: setStudentExamGrade
      summary: |
        Creates or updates a student's grade for an exam. If the grade
        already existed, the old value and the provided reason are archived
        in GradeHistory before the new value is written: "reason" is
        therefore required whenever this is an update.
      x-poja-roles: [ADMIN, TEACHER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeSave"
      responses:
        "200":
          description: Grade recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grade"

  /grades/{gradeId}/history:
    parameters:
      - name: gradeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Grades]
      operationId: getGradeHistory
      summary: History of changes made to a grade (complaints, corrections, etc.).
      x-poja-roles: [ADMIN, TEACHER, STUDENT]
      responses:
        "200":
          description: Grade history, oldest to most recent.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GradeHistory"

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      description: Page number (starts at 1).
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PromotionId:
      name: promotionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated, but insufficient rights for this resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:

    Role:
      type: string
      enum: [ADMIN, TEACHER, STUDENT]

    Track:
      type: string
      description: Academic track.
      enum: [EL, TN]

    Error:
      type: object
      required: [type, message]
      properties:
        type:
          type: string
        message:
          type: string

    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthToken:
      type: object
      properties:
        token:
          type: string
        role:
          $ref: "#/components/schemas/Role"

    Promotion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        startYear:
          type: string
          format: date-time

    Group:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ref:
          type: string
        promotionId:
          type: string
          format: uuid
        track:
          $ref: "#/components/schemas/Track"
    GroupSave:
      type: object
      required: [ref, promotionId, track]
      properties:
        ref:
          type: string
        promotionId:
          type: string
          format: uuid
        track:
          $ref: "#/components/schemas/Track"

    Student:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ref:
          type: string
        name:
          type: string
        firstName:
          type: string
        email:
          type: string
          format: email
    StudentSave:
      type: object
      required: [ref, name, firstName, email]
      properties:
        ref:
          type: string
        name:
          type: string
        firstName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          description: Provided only on creation or when changing the password.

    Teacher:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
    TeacherSave:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
          format: email

    Course:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ref:
          type: string
        title:
          type: string
        credits:
          type: integer
    CourseSave:
      type: object
      required: [ref, title, credits]
      properties:
        ref:
          type: string
        title:
          type: string
        credits:
          type: integer

    CourseAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        teacherId:
          type: string
          format: uuid
        academicYear:
          type: integer
          description: Starting academic year.
        concernedGroupIds:
          type: array
          description: Groups concerned by this assignment (not necessarily all of the promotion's groups).
          items:
            type: string
            format: uuid
    CourseAssignmentSave:
      type: object
      required: [courseId, teacherId, academicYear, concernedGroupIds]
      properties:
        courseId:
          type: string
          format: uuid
        teacherId:
          type: string
          format: uuid
        academicYear:
          type: integer
        concernedGroupIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    Exam:
      type: object
      properties:
        id:
          type: string
          format: uuid
        courseAssignmentId:
          type: string
          format: uuid
        dateExam:
          type: string
          format: date-time
        coefficient:
          type: number
    ExamSave:
      type: object
      required: [dateExam, coefficient]
      properties:
        dateExam:
          type: string
          format: date-time
        coefficient:
          type: number

    Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
        examId:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        value:
          type: number
    GradeSave:
      type: object
      required: [value]
      properties:
        value:
          type: number
        reason:
          type: string
          description: Required if the grade already existed and is being changed (complaint, error, etc.).

    GradeHistory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        gradeId:
          type: string
          format: uuid
        oldValue:
          type: number
        newValue:
          type: number
        reason:
          type: string
        modifiedAt:
          type: string
          format: date-time

    Graduate:
      type: object
      description: A row of the graduate list (also reflected in the exported xlsx file).
      properties:
        rank:
          type: integer
        studentId:
          type: string
          format: uuid
        studentRef:
          type: string
        name:
          type: string
        firstName:
          type: string
        average:
          type: number

    TranscriptEmailRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, SENT, FAILED]