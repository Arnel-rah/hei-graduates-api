openapi: 3.0.3
info:
  title: HEI Graduates API
  version: 1.0.0
  description: API for managing HEI Graduates

servers:
  - url: http://localhost:8080/
    description: Local development server
  - url: https://i7qraij2dkgzjk7t3jdou2dg2y0mfuzd.lambda-url.eu-west-3.on.aws/
    description: Pre-production server

tags:
  - name: Auth
  - name: Promotions
  - name: AcademicYears
  - name: Semesters
  - name: Groups
  - name: Students
  - name: Courses
  - name: CourseAssignments
  - name: Exams
  - name: Grades
  - name: Transcripts

security:
  - bearerAuth: []

paths:

  /login:
    post:
      tags:
        - Auth
      operationId: login
      summary: "Authenticates a user."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Successful authentication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /register:
    post:
      tags:
        - Auth
      operationId: register
      summary: "Creates a user account."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "400":
          $ref: "#/components/responses/BadRequest"

  /promotions:
    get:
      tags:
        - Promotions
      operationId: getPromotions
      summary: "Lists all promotions."
      x-poja-roles:
        - ADMIN
        - TEACHER
        - STUDENT
      responses:
        "200":
          description: List of promotions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Promotion"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /promotions/{promotionId}/graduates:
    parameters:
      - $ref: "#/components/parameters/PromotionId"
    get:
      tags:
        - Promotions
      operationId: getPromotionGraduates
      summary: "Lists the graduates of a promotion."
      x-poja-roles:
        - ADMIN
      parameters:
        - name: track
          in: query
          schema:
            $ref: "#/components/schemas/Track"
      responses:
        "200":
          description: List of graduates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Graduate"
        "404":
          $ref: "#/components/responses/NotFound"

  /promotions/{promotionId}/graduates/export:
    parameters:
      - $ref: "#/components/parameters/PromotionId"
    get:
      tags:
        - Promotions
      operationId: exportPromotionGraduates
      summary: "Exports the graduate list as an XLSX file."
      x-poja-roles:
        - ADMIN
      parameters:
        - name: track
          in: query
          schema:
            $ref: "#/components/schemas/Track"
      responses:
        "302":
          description: Direct download of the graduate list.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "404":
          $ref: "#/components/responses/NotFound"

  /academic-years:
    post:
      tags:
        - AcademicYears
      operationId: createAcademicYear
      summary: "Creates an academic year."
      x-poja-roles:
        - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicYearSave"
      responses:
        "201":
          description: Academic year created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicYear"

  /promotions/{promotionId}/academic-years:
    parameters:
      - $ref: "#/components/parameters/PromotionId"
    get:
      tags:
        - AcademicYears
      operationId: getPromotionAcademicYears
      summary: "Lists a promotion's academic years."
      x-poja-roles:
        - ADMIN
        - TEACHER
        - STUDENT
      responses:
        "200":
          description: List of academic years.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AcademicYear"

  /academic-years/{academicYearId}/publish:
    parameters:
      - name: academicYearId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - AcademicYears
      operationId: publishAcademicYear
      summary: "Publishes academic year results."
      x-poja-roles:
        - ADMIN
      responses:
        "200":
          description: Academic year published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicYear"
        "404":
          $ref: "#/components/responses/NotFound"

  /semesters:
    post:
      tags:
        - Semesters
      operationId: createSemester
      summary: "Creates a semester."
      x-poja-roles:
        - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SemesterSave"
      responses:
        "201":
          description: Semester created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Semester"

  /groups:
    post:
      tags:
        - Groups
      operationId: createGroup
      summary: "Creates a group."
      x-poja-roles:
        - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupSave"
      responses:
        "201":
          description: Group created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"

  /students:
    post:
      tags:
        - Students
      operationId: createStudent
      summary: "Creates a student."
      x-poja-roles:
        - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentSave"
      responses:
        "201":
          description: Student created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  /students/{studentId}:
    parameters:
      - $ref: "#/components/parameters/StudentId"
    get:
      tags:
        - Students
      operationId: getStudentById
      summary: "Retrieves a student."
      x-poja-roles:
        - ADMIN
        - TEACHER
        - STUDENT
      responses:
        "200":
          description: The student.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /students/{studentId}/grades:
    parameters:
      - $ref: "#/components/parameters/StudentId"
    get:
      tags:
        - Students
      operationId: getStudentGrades
      summary: "Returns the student's grades."
      x-poja-roles:
        - ADMIN
        - TEACHER
        - STUDENT
      parameters:
        - name: semesterId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Grades of the student.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Grade"
        "403":
          $ref: "#/components/responses/Forbidden"

  /students/{studentId}/transcript:
    parameters:
      - $ref: "#/components/parameters/StudentId"
    get:
      tags:
        - Transcripts
      operationId: getStudentTranscript
      summary: "Returns the student's academic transcript."
      x-poja-roles:
        - ADMIN
        - TEACHER
        - STUDENT
      responses:
        "200":
          description: Computed transcript.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcript"
        "404":
          $ref: "#/components/responses/NotFound"

  /students/{studentId}/transcript-emails:
    parameters:
      - $ref: "#/components/parameters/StudentId"
    post:
      tags:
        - Transcripts
      operationId: sendStudentTranscriptByEmail
      summary: "Generates and emails the transcript as a PDF."
      x-poja-roles:
        - ADMIN
        - STUDENT
      responses:
        "202":
          description: Transcript email request accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptEmailRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /courses:
    post:
      tags:
        - Courses
      operationId: createCourse
      summary: "Creates a course."
      x-poja-roles:
        - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseSave"
      responses:
        "201":
          description: Course created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

  /course-assignments:
    post:
      tags:
        - CourseAssignments
      operationId: createCourseAssignment
      summary: "Assigns a course to a teacher and group."
      x-poja-roles:
        - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseAssignmentSave"
      responses:
        "201":
          description: Course assignment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseAssignment"

  /course-assignments/{courseAssignmentId}/exams:
    parameters:
      - name: courseAssignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Exams
      operationId: createExam
      summary: "Creates an exam."
      x-poja-roles:
        - ADMIN
        - TEACHER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExamSave"
      responses:
        "201":
          description: Exam created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exam"

  /exams/{examId}/grades/{studentId}:
    parameters:
      - name: examId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/StudentId"
    put:
      tags:
        - Grades
      operationId: setStudentExamGrade
      summary: "Creates or updates a student's grade."
      x-poja-roles:
        - ADMIN
        - TEACHER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeSave"
      responses:
        "200":
          description: Grade recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grade"

  /grades/{gradeId}/history:
    parameters:
      - name: gradeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Grades
      operationId: getGradeHistory
      summary: "Returns the grade change history."
      x-poja-roles:
        - ADMIN
        - TEACHER
        - STUDENT
      responses:
        "200":
          description: Grade history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GradeHistory"

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:

    PromotionId:
      name: promotionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    StudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:

    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: Insufficient rights.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:

    Role:
      type: string
      enum:
        - ADMIN
        - TEACHER
        - STUDENT

    RegisterRole:
      type: string
      enum:
        - TEACHER
        - STUDENT

    Track:
      type: string
      enum:
        - EL
        - TN

    Error:
      type: object
      required:
        - type
        - message
      properties:
        type:
          type: string
        message:
          type: string

    Credentials:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - role
        - name
        - firstName
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 6
        role:
          $ref: "#/components/schemas/RegisterRole"
        name:
          type: string
        firstName:
          type: string
        ref:
          type: string

    AuthToken:
      type: object
      properties:
        token:
          type: string
        role:
          $ref: "#/components/schemas/Role"

    Promotion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        startYear:
          type: string
          format: date-time

    Group:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ref:
          type: string
        promotionId:
          type: string
          format: uuid

    GroupSave:
      type: object
      required:
        - ref
        - promotionId
      properties:
        ref:
          type: string
        promotionId:
          type: string
          format: uuid

    Student:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ref:
          type: string
        name:
          type: string
        firstName:
          type: string
        email:
          type: string
          format: email

    StudentSave:
      type: object
      required:
        - ref
        - name
        - firstName
        - email
        - password
        - promotionId
      properties:
        ref:
          type: string
        name:
          type: string
        firstName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        promotionId:
          type: string
          format: uuid

    Course:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ref:
          type: string
        title:
          type: string
        credits:
          type: integer
        mandatory:
          type: boolean

    CourseSave:
      type: object
      required:
        - ref
        - title
        - credits
        - mandatory
      properties:
        ref:
          type: string
        title:
          type: string
        credits:
          type: integer
        mandatory:
          type: boolean

    AcademicYear:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        order:
          type: integer
        promotionId:
          type: string
          format: uuid
        published:
          type: boolean

    AcademicYearSave:
      type: object
      required:
        - label
        - order
        - promotionId
      properties:
        label:
          type: string
        order:
          type: integer
        promotionId:
          type: string
          format: uuid

    Semester:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        order:
          type: integer
        academicYearId:
          type: string
          format: uuid

    SemesterSave:
      type: object
      required:
        - label
        - order
        - academicYearId
      properties:
        label:
          type: string
        order:
          type: integer
        academicYearId:
          type: string
          format: uuid

    CourseAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        teacherId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        semesterId:
          type: string
          format: uuid

    CourseAssignmentSave:
      type: object
      required:
        - courseId
        - teacherId
        - groupId
        - semesterId
      properties:
        courseId:
          type: string
          format: uuid
        teacherId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        semesterId:
          type: string
          format: uuid

    Exam:
      type: object
      properties:
        id:
          type: string
          format: uuid
        courseAssignmentId:
          type: string
          format: uuid
        dateExam:
          type: string
          format: date-time
        coefficient:
          type: number

    ExamSave:
      type: object
      required:
        - dateExam
        - coefficient
      properties:
        dateExam:
          type: string
          format: date-time
        coefficient:
          type: number

    Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
        examId:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        value:
          type: number

    GradeSave:
      type: object
      required:
        - value
      properties:
        value:
          type: number
        reason:
          type: string

    GradeHistory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        gradeId:
          type: string
          format: uuid
        oldValue:
          type: number
        newValue:
          type: number
        reason:
          type: string
        modifiedAt:
          type: string
          format: date-time
        modifiedByEmail:
          type: string
          format: email

    Graduate:
      type: object
      properties:
        rank:
          type: integer
        studentId:
          type: string
          format: uuid
        studentRef:
          type: string
        name:
          type: string
        firstName:
          type: string
        average:
          type: number
        totalCredits:
          type: integer
        diplomaType:
          $ref: "#/components/schemas/Track"

    Transcript:
      type: object
      properties:
        studentId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - COMPLET
            - INCOMPLET
        generalAverage:
          type: number
        totalCreditsEarned:
          type: integer
        totalCreditsExpected:
          type: integer
        semesters:
          type: array
          items:
            $ref: "#/components/schemas/SemesterResult"

    SemesterResult:
      type: object
      properties:
        semesterId:
          type: string
          format: uuid
        semesterLabel:
          type: string
        average:
          type: number
        creditsEarned:
          type: integer
        creditsExpected:
          type: integer

    TranscriptEmailRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PENDING
            - SENT
            - FAILED